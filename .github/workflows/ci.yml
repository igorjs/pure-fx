# SPDX-License-Identifier: Apache-2.0
#
# Per-runtime integration matrix for npm-shaped JavaScript packages.
# Shape matches the existing pure-fx pattern: a single `lint-and-test`
# job (the required status check) that handles lint + type-check +
# build + unit tests, then per-runtime-family integration jobs that
# download the built `dist/` artifact and run smoke tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  # ── Lint, type-check, build, unit tests, type tests ───────────────
  # This is the canonical `lint-and-test` required status check. Other
  # integration jobs depend on it via `needs: [lint-and-test]` so they
  # download an artefact rather than rebuilding.
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # Allowlist: GitHub API + git transport, npm registry,
          # Node.js binaries (setup-node), and pkg-containers (used by
          # actions/cache to fetch tar archives).
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            registry.npmjs.org:443
            registry.yarnpkg.com:443
            nodejs.org:443
            bun.sh:443
            raw.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: pnpm

      # The smoke-install tests run their Bun lane here and fail under CI without Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high --prod

      - name: Verify SPDX licence headers
        run: |
          missing=$(git ls-files '*.ts' '*.mts' '*.js' '*.mjs' \
            | grep -v '\.d\.\(ts\|mts\)$' \
            | xargs grep -L "SPDX-License-Identifier" 2>/dev/null || true)
          if [ -n "$missing" ]; then
            echo "Files missing SPDX-License-Identifier header:"
            printf '%s\n' "$missing"
            exit 1
          fi

      - name: Verify dependency versions are pinned
        run: |
          node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            const files = execSync("git ls-files", { encoding: "utf8" })
              .split("\n")
              .filter(f => (f === "package.json" || f.endsWith("/package.json")) && !f.includes("node_modules"));
            const bad = [];
            for (const f of files) {
              const pkg = JSON.parse(fs.readFileSync(f, "utf8"));
              for (const field of ["dependencies", "devDependencies", "optionalDependencies"]) {
                for (const [name, range] of Object.entries(pkg[field] || {})) {
                  if (typeof range === "string" && /^[\^~]/.test(range)) {
                    bad.push(f + ": " + field + "." + name + " = " + range);
                  }
                }
              }
            }
            if (bad.length) {
              console.error("Unpinned caret/tilde ranges (pin exact versions; Dependabot bumps them):");
              console.error(bad.join("\n"));
              process.exit(1);
            }
            console.log("All dependency versions are pinned.");
          '

      - name: Lint & format
        run: pnpm run lint

      - name: Type-check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Unit tests (coverage)
        env:
          NODE_V8_COVERAGE: .v8-coverage
        run: pnpm run coverage

      - name: Upload coverage summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: warn

      - name: Type tests
        run: pnpm run test:types

      - name: Upload build artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # ── Node integration matrix ────────────────────────────────────────
  integration-node:
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22","24","26"]
    name: "integration / node-${{ matrix.node-version }}"
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            registry.npmjs.org:443
            registry.yarnpkg.com:443
            nodejs.org:443
            bun.sh:443
            raw.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # The smoke-install tests run their Bun lane here and fail under CI without Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Unit tests
        run: pnpm test

      - name: Conformance suite (node)
        run: node scripts/test-conformance.mjs --lane node-current

  # ── Bun integration matrix ─────────────────────────────────────────
  integration-bun:
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        bun-version: ["canary","latest"]
    name: "integration / bun-${{ matrix.bun-version }}"
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            registry.npmjs.org:443
            registry.yarnpkg.com:443
            nodejs.org:443
            bun.sh:443
            raw.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Runtime smoke test
        run: bun tests/smoke-platform.mjs
      - name: Core smoke test
        run: bun tests/smoke-core.mjs
      - name: Conformance suite (bun)
        run: node scripts/test-conformance.mjs --lane bun

  # ── Cloudflare Workers integration (miniflare) ─────────────────────
  integration-workers:
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "integration / cf-workers"
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            registry.npmjs.org:443
            registry.yarnpkg.com:443
            nodejs.org:443
            workers.cloudflare.com:443
            raw.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Workers smoke test (miniflare)
        run: node tests/workers/run.mjs
      - name: Conformance suite (workers)
        run: node scripts/test-conformance.mjs --lane workers

  # ── Browser integration (Playwright + Chromium) ────────────────────
  integration-browser:
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "integration / browser"
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
    # harden-runner needs sudo on the runner VM and does not support
    # container jobs. This job runs without it.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Browser smoke test (Chromium)
        run: node tests/browser/run.mjs
