# SPDX-License-Identifier: Apache-2.0
#
# SLSA L3 build + attest pipeline for npm-shaped JavaScript packages.
# Triggered on `v*` tag push (the convention `scripts/release.mjs`
# follows). Produces:
#
#   1. An `npm pack` tarball (the artifact npm publish would receive).
#   2. A per-file in-toto attestation from actions/attest-build-provenance,
#      signed by Sigstore (Fulcio + Rekor).
#   3. A combined SLSA v1 provenance attestation from
#      slsa-framework/slsa-github-generator, run in an isolated workflow
#      context the caller cannot inject into — this is the L2 -> L3 gap
#      closer; the build environment the attestation describes is the
#      reusable workflow's own runner, not this one.
#   4. A GitHub Release with all three attached (tarball, .sha256
#      sidecar, .intoto.jsonl provenance).
#
# When the publish event for the release fires, publish.javascript.yml
# verifies the provenance against the tarball before pushing to npm
# and/or JSR (whichever the package targets via file presence).
#
# Release flow: slsa_provenance creates the GitHub release as a draft,
# then publish-gh attaches the assets and publishes it with a GitHub App
# token. A release published with GITHUB_TOKEN would not start
# publish.yml, so the App token is what triggers the npm and JSR publish.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Synthesised dev tag for testing without cutting a real release."
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  # ── Resolve tag + version once ─────────────────────────────────────
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            codeload.github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: r
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF##refs/tags/}"
            VERSION="${TAG#v}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
            VERSION="${TAG#v}"
          else
            SHORT_SHA="$(echo "${HEAD_SHA}" | cut -c1-7)"
            TAG="dev-${SHORT_SHA}"
            VERSION="0.0.0-${SHORT_SHA}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved tag=${TAG} version=${VERSION}"

      - name: Verify release tag
        if: ${{ !startsWith(steps.r.outputs.tag, 'dev-') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.r.outputs.tag }}
        run: node scripts/verify-release-tag.mjs

  # ── Build the npm tarball + attest provenance ──────────────────────
  build:
    needs: [resolve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.hash.outputs.digest }}
      filename: ${{ steps.pack.outputs.filename }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # Allowlist: GitHub API + git transport, npm registry (pnpm
          # install), Node.js binaries (setup-node), Sigstore endpoints
          # (fulcio for cert issuance, rekor for transparency log,
          # tuf-repo-cdn for trust roots). registry.yarnpkg.com kept
          # because pnpm fetches some packages from the Yarn mirror.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            registry.npmjs.org:443
            registry.yarnpkg.com:443
            nodejs.org:443
            raw.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - id: pack
        name: Pack tarball
        run: |
          set -euo pipefail
          mkdir -p dist-pack
          npm pack --pack-destination=./dist-pack
          tarballs=(dist-pack/*.tgz)
          FILENAME="${tarballs[0]}"
          [[ -e "$FILENAME" ]] || { echo "::error::npm pack produced no tarball."; exit 1; }
          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"
          # Cross-platform sha256 (sha256sum on Linux; this job is
          # ubuntu-latest so GNU coreutils are present).
          sha256sum "${FILENAME}" > "${FILENAME}.sha256"
          echo "::group::Tarball + sha256"
          ls -la dist-pack/
          cat "${FILENAME}.sha256"
          echo "::endgroup::"

      - id: hash
        name: Compute base64-encoded digest for SLSA generator
        run: |
          set -euo pipefail
          DIGEST=$(cd dist-pack && sha256sum ./*.tgz \
            | awk '{print $1"  "$NF}' | base64 -w0)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./
          output-file: dist-pack/sbom.cdx.json
          format: cyclonedx-json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest per-file build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist-pack/*.tgz

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: |
            dist-pack/*.tgz
            dist-pack/*.tgz.sha256
            dist-pack/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  # ── SLSA L3 provenance via the framework's reusable workflow ───────
  # Runs in an isolated job context the caller workflow cannot inject
  # into; this is the property that closes the L2 -> L3 gap. The build
  # environment the attestation describes is the reusable workflow's
  # own runner, not ours. End users verify with either:
  #   gh attestation verify <file> --owner <owner>
  #   slsa-verifier verify-artifact --provenance-path <intoto>
  #     --source-uri github.com/<owner>/<repo> <file>
  slsa_provenance:
    needs: [resolve, build]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0  # zizmor: ignore[unpinned-uses] SLSA verification requires the tag reference
    with:
      base64-subjects: ${{ needs.build.outputs.digest }}
      upload-assets: true
      draft-release: true
      upload-tag-name: ${{ needs.resolve.outputs.tag }}
      provenance-name: provenance-${{ needs.resolve.outputs.version }}.intoto.jsonl

  # ── Attach tarball + sha256 + provenance to the GH release ─────────
  # softprops/action-gh-release matches the draft by tag_name, uploads the
  # assets and publishes it (draft: false) with the App token.
  publish-gh:
    needs: [resolve, build, slsa_provenance]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: dist-release

      - name: Summarise release contents
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          {
            echo "## Release ${RELEASE_TAG}"
            echo ""
            echo "**Tarball + checksum + provenance attached.** Verify with:"
            echo ""
            echo '```bash'
            echo "gh attestation verify dist-release/*.tgz --owner ${{ github.repository_owner }}"
            echo "slsa-verifier verify-artifact dist-release/*.tgz \\"
            echo "  --provenance-path *.intoto.jsonl \\"
            echo "  --source-uri github.com/${{ github.repository }} \\"
            echo "  --source-tag ${RELEASE_TAG}"
            echo '```'
            echo ""
            echo '```'
            cat dist-release/*.sha256 | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach assets to GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1  # zizmor: ignore[superfluous-actions] publishes the SLSA draft release by tag_name with the App token
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          token: ${{ steps.app-token.outputs.token }}
          draft: false
          files: |
            dist-release/*.tgz
            dist-release/*.tgz.sha256
            dist-release/sbom.cdx.json
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.resolve.outputs.tag, 'dev-') || contains(needs.resolve.outputs.tag, '-alpha') || contains(needs.resolve.outputs.tag, '-beta') || contains(needs.resolve.outputs.tag, '-rc') }}
