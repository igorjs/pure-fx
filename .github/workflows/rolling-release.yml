# SPDX-License-Identifier: Apache-2.0
name: Rolling Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan the release without creating a commit, tag or release."
        required: false
        type: boolean
        default: true
      version:
        description: "Manual version such as 1.0.0. Leave empty to compute it from commits."
        required: false
        type: string
        default: ""
  # Enabled once JSR publishing works.
  # schedule:
  #   - cron: "0 6 * * 1"

permissions: {}

concurrency:
  group: rolling-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            nodejs.org:443
            codeload.github.com:443
      - name: Validate version input
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$RELEASE_VERSION" && ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.0.0; prerelease strings are not allowed."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          package-manager-cache: false
      # The App token (not GITHUB_TOKEN) lets the tag and release start other workflows.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Cut release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          args=(--ci)
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ -n "$RELEASE_VERSION" ]]; then
            args+=(--version "$RELEASE_VERSION")
          fi
          node scripts/release.mjs "${args[@]}"
